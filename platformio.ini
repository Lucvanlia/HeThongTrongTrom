; PlatformIO Project Configuration File for HeThongTrongTrom
; Dual-Core ESP32 + 100% Microsoft Azure IoT (MQTT TLS 8883) & Firebase Realtime
; Actuators: Active Buzzer, Dual LED, Smart Lock Servo SG90, LCD1602 I2C

; ------------------------------------------------------------------------------
; 1. MÔI TRƯỜNG CHÍNH: HỆ THỐNG CẢNH BÁO CHỐNG TRỘM IOT
; ------------------------------------------------------------------------------
[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
upload_port = COM3
monitor_port = COM3
monitor_filters = esp32_exception_decoder, default
build_src_filter = +<main.cpp> -<test_led.cpp> -<test_servo.cpp> -<test_lcd.cpp>

lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
    madhephaestus/ESP32Servo@^3.0.5

; ------------------------------------------------------------------------------
; 2. MÔI TRƯỜNG TEST: KIỂM TRA DÀN ĐÈN LED (ĐỘC LẬP 100%)
; ------------------------------------------------------------------------------
[env:test_led]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
upload_port = COM3
monitor_port = COM3
build_src_filter = +<test_led.cpp> -<main.cpp> -<test_servo.cpp> -<test_lcd.cpp>

; ------------------------------------------------------------------------------
; 3. MÔI TRƯỜNG TEST: CÂN CHỈNH SERVO VỀ 0 ĐỘ & TEST CHỐT CỬA (ĐỘC LẬP 100%)
; ------------------------------------------------------------------------------
[env:test_servo]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
upload_port = COM3
monitor_port = COM3
build_src_filter = +<test_servo.cpp> -<main.cpp> -<test_led.cpp> -<test_lcd.cpp>

lib_deps =
    madhephaestus/ESP32Servo@^3.0.5

; ------------------------------------------------------------------------------
; 4. MÔI TRƯỜNG TEST: CHẨN ĐOÁN & KIỂM TRA MÀN HÌNH LCD 1602 I2C
; ------------------------------------------------------------------------------
[env:test_lcd]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
upload_port = COM3
monitor_port = COM3
build_src_filter = +<test_lcd.cpp> -<main.cpp> -<test_led.cpp> -<test_servo.cpp>

lib_deps =
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
